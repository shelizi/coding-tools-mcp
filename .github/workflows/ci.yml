name: CI

on:
  workflow_dispatch:

jobs:
  node-agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Node Agent
        run: pnpm --filter @coding-tools/node-agent run verify

  node-agent-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux Node Agent image
        run: docker build -f packages/node-agent/Dockerfile -t coding-tools-node-agent:ci .
      - name: Smoke test Linux Node Agent container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name coding-tools-node-agent-ci \
            -p 127.0.0.1:37891:3789 \
            -e CTMCP_OAUTH_PASSWORD=ci-smoke-password \
            coding-tools-node-agent:ci
          trap 'docker logs coding-tools-node-agent-ci || true; docker rm -f coding-tools-node-agent-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:37891/health >/dev/null; then
              echo 'node-agent-docker-smoke=ok'
              exit 0
            fi
            sleep 1
          done
          echo 'Node Agent health endpoint did not become ready.' >&2
          exit 1

  headless-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check UI-independent Rust core
        run: pnpm run rust:check:headless

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo build
        working-directory: src-tauri
        run: cargo build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run version:check
      - run: pnpm run check
