[package]
name = "coding-tools-tunnel-server"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "json"] }
base64 = "0.22"
bytes = "1"
coding-tools-tunnel-protocol = { path = "../../crates/tunnel-protocol" }
ed25519-dalek = "2"
futures-util = "0.3"
http-body-util = "0.1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
